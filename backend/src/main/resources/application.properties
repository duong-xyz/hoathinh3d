spring.application.name=app
server.port=8080
#Configure RSA key pair
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem
#Database Connection Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hh3d?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Configuring Spring Data JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect